version: '3.8'

services:
  smartx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartx-app
    ports:
      - "8080:8080"
      - "8443:8443"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080;https://+:8443
    volumes:
      - ./data:/app/data
    restart: unless-stopped